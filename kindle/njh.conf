# Kindle family calendar: run /mnt/us/njh-boot.sh at boot (skip with /mnt/us/NO_AUTOSTART)
start on started framework
stop on stopping framework

export LANG LC_ALL

pre-start script
	[ -f /mnt/us/NO_AUTOSTART ] && return 0
	[ -f /mnt/us/njh-boot.sh ] && /bin/sh /mnt/us/njh-boot.sh
	return 0
end script
